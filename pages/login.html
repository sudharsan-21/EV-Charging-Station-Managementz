<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Authentication | EV Charging Station Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7 col-xl-6">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <!-- Card Header / Brand -->
          <div class="p-4 p-md-5 bg-dark text-white text-center" style="background: radial-gradient(circle at 100% 0%, #1e293b 0%, #0b1329 100%);">
            <div class="ev-brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.6rem;">
              <i class="bi bi-lightning-charge-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">VoltFlow Infrastructure</h3>
            <p class="text-secondary small mb-0">Role-Based EV Charging Station Operating Platform</p>
          </div>

          <!-- Login Form Body -->
          <div class="p-4 p-md-5 bg-white">
            <form id="portalLoginForm">
              <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope text-secondary"></i></span>
                  <input type="email" class="form-control" id="loginEmail" required value="admin@evcharge.com" placeholder="name@domain.com">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label text-muted small fw-semibold">Account Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
                  <input type="password" class="form-control" id="loginPassword" required value="voltflow2026" placeholder="••••••••">
                </div>
              </div>

              <button type="submit" class="btn btn-ev-primary w-100 mb-4 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Platform
              </button>
            </form>

            <!-- Quick Role Demo Switcher (Academic Project Feature) -->
            <div class="border-top pt-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted small fw-bold text-uppercase" style="font-size:0.75rem;">1-Click Academic Demo Logins</span>
                <span class="badge bg-light text-dark border">LWP Review 01</span>
              </div>

              <div class="row g-2">
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLoginRole('ADMIN')">
                    <div class="fw-bold small"><i class="bi bi-shield-shaded text-success me-1"></i> Admin</div>
                    <small class="text-muted" style="font-size:0.7rem;">admin@evcharge.com</small>
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLoginRole('STATION_MANAGER')">
                    <div class="fw-bold small"><i class="bi bi-building-gear text-info me-1"></i> Manager</div>
                    <small class="text-muted" style="font-size:0.7rem;">manager@evcharge.com</small>
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLoginRole('TECHNICIAN')">
                    <div class="fw-bold small"><i class="bi bi-tools text-warning me-1"></i> Technician</div>
                    <small class="text-muted" style="font-size:0.7rem;">tech@evcharge.com</small>
                  </button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLoginRole('CUSTOMER')">
                    <div class="fw-bold small"><i class="bi bi-person-fill text-primary me-1"></i> Customer</div>
                    <small class="text-muted" style="font-size:0.7rem;">customer@evcharge.com</small>
                  </button>
                </div>
              </div>
            </div>

            <div class="text-center mt-4 pt-2">
              <a href="../index.html" class="text-decoration-none text-secondary small">
                <i class="bi bi-arrow-left me-1"></i> Return to Homepage
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App State -->
  <script src="../js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('portalLoginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('loginEmail').value.trim();
          
          let role = 'ADMIN';
          if (email.includes('manager')) role = 'STATION_MANAGER';
          else if (email.includes('tech')) role = 'TECHNICIAN';
          else if (email.includes('customer')) role = 'CUSTOMER';

          evApp.setCurrentUser(role);
          showToast('Authentication Successful', `Welcome back! Signed in as ${role}`, 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 400);
        });
      }
    });

    function quickLoginRole(role) {
      evApp.setCurrentUser(role);
      showToast('Quick Sign-in', `Logged in as ${role}`, 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 300);
    }
  </script>
</body>
</html>
